[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "endstone-cps-detector"
dynamic = ["version"]
description = "Conservative real-time melee CPS detection for Endstone Bedrock servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["endstone", "minecraft", "bedrock", "cps", "anti-cheat"]
authors = [
    { name = "Endstone CPS Detector contributors" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "endstone>=0.11.9,<0.12",
    "pytest>=8.0",
    "ruff>=0.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/STUP1DLADKAA/python-example-plugin"
Documentation = "https://endstone.dev/latest/"
Issues = "https://github.com/STUP1DLADKAA/python-example-plugin/issues"

[project.entry-points."endstone"]
cps-detector = "endstone_cps_detector:CPSTrackerPlugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_cps_detector"]

[tool.hatch.build.hooks.vcs]
version-file = "src/endstone_cps_detector/_version.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["I", "E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
