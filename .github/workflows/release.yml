name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and preview without creating a GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version and extract notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $RELEASE_VERSION (expected X.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "::error::Tag v$RELEASE_VERSION already exists"
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

          awk '
            /^## \[Unreleased\]/ { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The Unreleased section in CHANGELOG.md is empty"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: uv sync --extra dev --locked

      - name: Validate API, syntax, lint, and tests
        run: uv run python tools/build.py validate

      - name: Build and inspect release wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: uv run python tools/build.py package

      - name: Create GitHub release and attach wheel
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/*.whl \
            --title "v$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Would create GitHub release v$RELEASE_VERSION at $GITHUB_SHA"
          echo "Wheel: $(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          echo "Release notes:"
          cat release-notes.md
